<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyTorch模型部署实战：ONNX与TensorRT全流程 - 课程目录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
            padding-bottom: 80px; /* 为页脚留出空间 */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(90deg, #4CAF50, #2196F3);
            color: white;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            opacity: 0.95;
        }

        .subtitle {
            display: inline-block;
            background-color: #FF9800;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 15px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.4);
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .chapter-card {
            background-color: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 8px solid #FF5722;
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .chapter-card:nth-child(2n) {
            border-left-color: #4CAF50;
        }

        .chapter-card:nth-child(3n) {
            border-left-color: #2196F3;
        }

        .chapter-card:nth-child(4n) {
            border-left-color: #9C27B0;
        }

        .chapter-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .chapter-number {
            display: inline-block;
            background: linear-gradient(135deg, #FF5722, #FF9800);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            text-align: center;
            line-height: 42px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(255, 87, 34, 0.3);
        }

        .chapter-card:nth-child(2n) .chapter-number {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
        }

        .chapter-card:nth-child(3n) .chapter-number {
            background: linear-gradient(135deg, #2196F3, #03A9F4);
        }

        .chapter-card:nth-child(4n) .chapter-number {
            background: linear-gradient(135deg, #9C27B0, #E91E63);
        }

        .chapter-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2c3e50;
            line-height: 1.4;
        }

        .chapter-content {
            color: #555;
            line-height: 1.6;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .chapter-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: linear-gradient(to right, #2196F3, #21CBF3);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
            align-self: flex-start;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }

        .chapter-link:hover {
            background: linear-gradient(to right, #0d8bf2, #0cb8e8);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(33, 150, 243, 0.4);
        }

        .chapter-link i {
            margin-left: 8px;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: linear-gradient(90deg, #1a237e, #283593);
            color: white;
            border-radius: 20px;
            margin-top: 40px;
            box-shadow: 0 -5px 20px rgba(26, 35, 126, 0.2);
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4CAF50, #FFC107, #F44336);
        }

        .footer-content {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .footer-content i {
            color: #FFC107;
            margin: 0 10px;
        }

        .decoration {
            position: absolute;
            font-size: 3rem;
            opacity: 0.1;
            z-index: 0;
        }

        .decoration-1 {
            top: 20px;
            left: 30px;
            color: #FF5722;
        }

        .decoration-2 {
            bottom: 20px;
            right: 30px;
            color: #4CAF50;
        }

        @media (max-width: 768px) {
            .course-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-robot"></i> PyTorch模型部署实战</h1>
            <p>ONNX与TensorRT全流程：从模型训练到生产环境部署的完整指南</p>
            <div class="subtitle">30章精华内容 · 实战驱动 · 中小学生友好色系</div>
            <div class="decoration decoration-1"><i class="fas fa-brain"></i></div>
            <div class="decoration decoration-2"><i class="fas fa-bolt"></i></div>
        </header>

        <main>
            <div class="course-grid" id="courseDirectory">
                <!-- 目录将通过JavaScript动态生成 -->
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <i class="fas fa-gem"></i> 蓝海资料掘金营 <i class="fas fa-gem"></i>
            </div>
            <div class="decoration decoration-1"><i class="fas fa-code"></i></div>
            <div class="decoration decoration-2"><i class="fas fa-rocket"></i></div>
        </footer>
    </div>

    <script>
        // 课程目录数据
        const chapters = [
            { number: 1, title: "课程导论", content: "模型部署的意义与挑战、PyTorch/ONNX/TensorRT技术栈概览、课程目标与学习路径。" },
            { number: 2, title: "环境搭建", content: "CUDA与cuDNN安装、PyTorch GPU版本安装、ONNX与ONNX Runtime安装、TensorRT安装与验证。" },
            { number: 3, title: "PyTorch模型开发基础", content: "张量操作、自动求导、神经网络模块构建、模型训练与保存。" },
            { number: 4, title: "PyTorch模型推理优化", content: "模型评估模式、推理性能基准测试、常见推理瓶颈分析。" },
            { number: 5, title: "ONNX格式详解", content: "ONNX计算图结构、算子集、数据类型、模型元数据。" },
            { number: 6, title: "PyTorch到ONNX转换", content: "torch.onnx.export函数详解、动态轴设置、自定义算子处理。" },
            { number: 7, title: "ONNX模型验证", content: "ONNX检查器、可视化工具Netron、ONNX Runtime推理验证。" },
            { number: 8, title: "ONNX模型优化", content: "ONNX Simplifier简化模型、常量折叠、算子融合、冗余节点消除。" },
            { number: 9, title: "TensorRT核心概念", content: "工作流、Builder、Engine、Context、精度模式（FP32/FP16/INT8）。" },
            { number: 10, title: "ONNX到TensorRT转换", content: "trtexec命令行工具、Python API解析器、构建配置。" },
            { number: 11, title: "TensorRT推理引擎构建", content: "构建期优化、层融合策略、内存优化、序列化与反序列化。" },
            { number: 12, title: "TensorRT推理执行", content: "分配设备内存、数据传输、执行上下文、异步推理。" },
            { number: 13, title: "动态形状支持", content: "动态批次、动态维度、配置优化配置文件、运行时形状推断。" },
            { number: 14, title: "FP16混合精度推理", content: "原理与优势、启用方法、精度损失评估与校准。" },
            { number: 15, title: "INT8量化推理", content: "量化原理、校准表生成、后训练量化、量化感知训练。" },
            { number: 16, title: "自定义算子支持", content: "ONNX中注册自定义算子、TensorRT插件开发、C++/Python插件实现。" },
            { number: 17, title: "多模型流水线部署", content: "多个Engine协同、流水线并行、数据依赖管理。" },
            { number: 18, title: "性能分析与调优", content: "Nsight Systems性能分析、内核瓶颈识别、内存带宽优化。" },
            { number: 19, title: "模型部署测试", content: "单元测试、集成测试、精度测试、性能回归测试。" },
            { number: 20, title: "图像分类模型部署实战", content: "ResNet从训练到TensorRT部署全流程。" },
            { number: 21, title: "目标检测模型部署实战", content: "YOLO系列模型转换与优化（以YOLOv5为例）。" },
            { number: 22, title: "语义分割模型部署实战", content: "UNet/DeepLab模型部署与后处理集成。" },
            { number: 23, title: "自然语言处理模型部署", content: "BERT模型转换、动态序列长度处理。" },
            { number: 24, title: "生成模型部署实战", content: "GAN/Stable Diffusion部分组件部署考量。" },
            { number: 25, title: "多框架模型集成", content: "PyTorch/TensorFlow模型统一通过ONNX部署。" },
            { number: 26, title: "生产环境部署", content: "Docker容器化、服务化框架（Triton Inference Server）。" },
            { number: 27, title: "边缘设备部署", content: "Jetson平台部署、TensorRT加速、功耗与性能平衡。" },
            { number: 28, title: "部署监控与维护", content: "推理服务监控、模型版本管理、A/B测试、热更新。" },
            { number: 29, title: "安全与可靠性", content: "模型加密、输入验证、异常处理、故障恢复。" },
            { number: 30, title: "课程总结与进阶", content: "技术趋势展望、扩展学习资源、社区与最佳实践。" }
        ];

        // 生成目录卡片
        const courseDirectory = document.getElementById('courseDirectory');
        
        chapters.forEach(chapter => {
            // 格式化章节编号，确保是两位数
            const chapterNum = chapter.number.toString().padStart(2, '0');
            
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.innerHTML = `
                <div class="chapter-number">${chapter.number}</div>
                <h3 class="chapter-title">${chapter.title}</h3>
                <p class="chapter-content">${chapter.content}</p>
                <a href="${chapterNum}.html" class="chapter-link">开始学习 <i class="fas fa-arrow-right"></i></a>
            `;
            
            courseDirectory.appendChild(card);
        });
    </script>
</body>
</html>
